[package]
name = "sg-knowledge"
description = "ShellGenius knowledge: vector search, embeddings, PDF extraction, ingestion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ndarray = "0.16"
flate2 = "1"   # gzip for chunks.json.gz

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

[dependencies.tokenizers]
version = "0.21"
optional = true

[dependencies.lopdf]
version = "0.34"
optional = true

[dependencies.pdf-extract]
version = "0.7"
optional = true

[features]
default = []
embeddings = ["ort", "tokenizers"]
pdf = ["lopdf", "pdf-extract"]
full = ["embeddings", "pdf"]
