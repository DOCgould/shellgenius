[workspace]
members = [
    "crates/sg-core",
    "crates/sg-agent",
    "crates/sg-ui",
    "crates/sg-knowledge",
    "crates/sg-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Shell
shlex = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
axum = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# UI
indicatif = "0.17"
pulldown-cmark = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Schema generation
schemars = "0.8"

# Config
toml = "0.8"

# Subprocess timeout
wait-timeout = "0.2"

# Internal crates
sg-core = { path = "crates/sg-core" }
sg-agent = { path = "crates/sg-agent" }
sg-ui = { path = "crates/sg-ui" }
sg-knowledge = { path = "crates/sg-knowledge" }
